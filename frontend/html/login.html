<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lakoa</title>
    <link rel="stylesheet" href="../css/login.css">
    <!-- Fuente limpia similar a la del prototipo -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <main class="login-container">
        <!-- Panel Izquierdo: Imagen de eucalipto, formas geométricas y logo -->
        <section class="brand-panel">
            <!-- Formas geométricas decorativas superiores -->
            <div class="shape shape-dark"></div>
            <div class="shape shape-medium"></div>
            <div class="shape shape-light"></div>

            <!-- Contenido central del logo -->
            <div class="brand-content">
                <!-- Ilustración SVG del Koala basada en tu prototipo -->
                <svg class="koala-icon" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                    <!-- Oreja izquierda -->
                    <circle cx="48" cy="65" r="36" fill="#7c7c7c" stroke="#1a1a1a" stroke-width="8"/>
                    <circle cx="48" cy="65" r="20" fill="#a8a8a8"/>
                    <!-- Oreja derecha -->
                    <circle cx="152" cy="65" r="36" fill="#7c7c7c" stroke="#1a1a1a" stroke-width="8"/>
                    <circle cx="152" cy="65" r="20" fill="#a8a8a8"/>
                    <!-- Cabeza -->
                    <rect x="44" y="45" width="112" height="105" rx="48" fill="#999999" stroke="#1a1a1a" stroke-width="8"/>
                    <!-- Ojos -->
                    <circle cx="75" cy="95" r="6" fill="#1a1a1a"/>
                    <circle cx="125" cy="95" r="6" fill="#1a1a1a"/>
                    <!-- Nariz -->
                    <rect x="85" y="92" width="30" height="44" rx="15" fill="#1a1a1a"/>
                </svg>

                <h2 class="brand-title">Lakoa <span class="brand-roman">I</span></h2>
            </div>

            <!-- Barra decorativa inferior -->
            <div class="bottom-bar"></div>
        </section>

        <!-- Panel Derecho: Formulario de Inicio de Sesión -->
        <section class="form-panel">
            <div class="form-wrapper">
                <h1 class="welcome-title">¡Bienvenido a Lakoa I!</h1>

                <form id="loginForm" novalidate>
                    <h2 class="form-heading">Iniciar Sesión</h2>

                    <div class="input-group">
                        <label for="correo">Correo institucional:</label>
                        <input 
                            type="email" 
                            id="correo" 
                            name="correo" 
                            placeholder="usuario@uv.mx" 
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña:</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••••••" 
                            required
                        >
                    </div>

                    <p id="errorMessage" class="error-message" aria-live="polite"></p>

                    <div class="button-container">
                        <button type="submit" id="btnAcceder" class="btn-submit">Acceder</button>
                    </div>
                    <div class="register-trigger">
                        <span>¿Aún no tienes cuenta?</span>
                        <button type="button" id="btnAbrirRegistro" class="btn-link">Crear cuenta</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

        <!-- Modal de Creación de Cuenta -->
    <div id="registerModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
            <button type="button" id="btnCerrarRegistro" class="modal-close" aria-label="Cerrar ventana">&times;</button>

            <h2 id="registerTitle" class="modal-title">Crear cuenta</h2>

            <form id="registerForm" novalidate>
                <div class="input-group">
                    <label for="regNombre">Nombre completo:</label>
                    <input
                        type="text"
                        id="regNombre"
                        name="nombre"
                        placeholder="Tu nombre"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="regCorreo">Correo institucional:</label>
                    <input
                        type="email"
                        id="regCorreo"
                        name="correo"
                        placeholder="usuario@uv.mx"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="regPassword">Contraseña:</label>
                    <input
                        type="password"
                        id="regPassword"
                        name="password"
                        placeholder="••••••••••••"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="regRol">Rol:</label>
                    <select id="regRol" name="rol" required>
                        <option value="" selected disabled>Selecciona tu rol</option>
                        <option value="alumno">Alumno</option>
                        <option value="profesor">Profesor</option>
                    </select>
                </div>

                <p id="registerFeedback" class="feedback-message" aria-live="polite"></p>

                <div class="button-container">
                    <button type="submit" id="btnRegistrar" class="btn-submit">Registrarse</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../javascript/Login.js"></script>
</body>
</html>
