<!DOCTYPE html>
<html lang="es">
    <link rel="stylesheet" href="../css/correo.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaKoa I - Correo</title>
</head>
<body>
    <header>
        <div id="contenedor-botones">

            <!-- Botón regresar -->
            <button id="btnRegresar" type="button"
                    aria-label="Regresar" title="Regresar">

                <svg viewBox="0 0 24 24" width="28" height="28"
                    fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">

                    <path d="M3 10.5L12 3l9 7.5"></path>
                    <path d="M5.5 9.5V21h13V9.5"></path>
                    <path d="M9 21v-7h6v7"></path>

                </svg>
            </button>

            <h1>LaKoa I</h1>

        </div>
    </header>

    <!-- Buscador -->
    <section>
        <input
            type="text"
            id="inputBuscar"
            placeholder="Buscar correo por asunto..."
        >
        <button id="btnBuscar" type="button">Buscar</button>
    </section>

    <!-- Menu lateral -->
    <aside>
        <button id="btnNuevoCorreo" type="button">Nuevo correo</button>
        <button id="btnBandeja" type="button">Bandeja de entrada</button>
    </aside>

    <!-- Lista de correos -->
    <main>
        <table>
            <thead>
                <tr>
                    <th>Selección</th>
                    <th>Fecha</th>
                    <th>Remitente</th>
                    <th>Asunto</th>
                </tr>
            </thead>
            <tbody id="tablaCorreos">
                <!--  filas -->
            </tbody>
        </table>
    </main>

    <!-- Modal / panel para redactar nuevo correo -->
    <section id="panelNuevoCorreo" style="display: none;">
        <h3>Nuevo correo</h3>
        <form id="formNuevoCorreo">
            <input type="email" id="inputDestinatario" placeholder="Correo institucional del destinatario" required>
            <input type="text" id="inputAsunto" placeholder="Asunto" required>
            <textarea id="inputCuerpo" placeholder="Escribe tu mensaje..." required></textarea>
            <button type="submit">Enviar</button>
            <button type="button" id="btnCancelarEnvio">Cancelar</button>
        </form>
    </section>

    <!-- Panel  al dar clic a un correo -->
    <section id="panelDetalleCorreo" style="display: none;">
        <button type="button" id="btnEliminarCorreo">Eliminar</button>
        <button type="button" id="btnCerrarDetalle">X</button>
        <h3 id="detalleAsunto"></h3>
        <p><strong>Envía:</strong> <span id="detalleRemitente"></span></p>
        <p><strong>Fecha:</strong> <span id="detalleFecha"></span></p>
        <hr>
        <p id="detalleCuerpo"></p>
    </section>

    <script src="../javascript/correo.js"></script>
</body>
</html>
