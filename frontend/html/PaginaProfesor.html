<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesor</title>

    <!-- Tipografías de la maqueta: Archivo Black (título) y Montserrat (resto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/PaginaProfesor.css">
</head>
<body>
    <section id="cabecera">
        <div id="contenedor-botones">
            <button id="tituloPagina"><span>Lakoa I</span></button>

            <button id="btnCorreo" type="button" aria-label="Correo" title="Correo">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                    stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="1"></rect>
                    <path d="M3 6l9 7 9-7"></path>
                </svg>
            </button>

            <div id="contenedor-perfil">
                <button id="btnPerfil" type="button" aria-label="Perfil" title="Perfil">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
                    </svg>
                </button>

                <!--Modal flotante para el botón de perfil-->
                <div id="modal-perfil" hidden>
                    <span id="perfil-nombre">Nombre de usuario</span>
                    <span id="perfil-matricula">Matricula</span>
                    <button id="logout" type="button">Cerrar sesión</button>
                </div>
            </div>
    
        </div>
    </section>
    <section id="areaTrabajo">
        <!--Modal de listado de cursos-->
        <div id="areaCursos" class="modal-class">
            <div id="contenedor-busqueda">
                <input type="text" id="barra-busqueda" placeholder="Buscar curso por id/nombre/etc"
                    aria-label="Buscar curso">
                <button id="btnBuscar" type="button" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="10.5" cy="10.5" r="6"></circle>
                        <path d="M15 15l5 5"></path>
                    </svg>
                </button>
            </div>
            <div id="areaPrincipal">
                <div id="areaBotones">
                <button id="btnCrearCurso" type="button">+ Crear nuevo grupo</button>
                </div>
                <div id="contenedorCursos">
                    <!--Aqui se insertarán los cursos dinamicamente-->
                </div>
            </div>
        </div>
        
        <!--Modal dentro de un curso-->
        <div id="areaActividad" class="modal-class">
            <div id="barra-opciones-profesor">
                <span id="nombre-curso">
                    <!--Aqui se insertará el nombre del curso dinamicamente-->nombre curso
                </span>
                <div id="barra-botones">
                    <ul>
                        <li>
                            <button type="button" class="activo" data-seccion="actividades">Actividades</button>
                        </li>

                        <li>
                            <button type="button" data-seccion="examenes">Exámenes</button>
                        </li>
                        <li>
                            <button type="button" data-seccion="alumnos">Alumnos</button>
                        </li>
                    </ul>
                </div>
            </div>

            <div id="seccion-actividades" class="seccion-grupo">
                <div id="actividades">
                    <div id="filtros-actividades" class="filtros">
                        <ul>
                            <li>
                                <button type="button" class="activo" data-filtro="actuales">Actuales</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="concluidas">Concluidas</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="prorroga">Con prorroga</button>
                            </li>
                        </ul>
                    </div>

                    <div id="contenedor-actividades">
                        <!--Aqui se insertarán las actividades dinamicamente-->
                    </div>
                </div>
            </div>
            
            <div id="seccion-examenes" class="seccion-grupo">
                <div id="examenes">
                    <div id="filtros-examenes" class="filtros">
                        <ul>
                            <li>
                                <button type="button" class="activo" data-filtro="actuales">Actuales</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="concluidas">Concluidas</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="prorroga">Con prorroga</button>
                            </li>
                        </ul>
                    </div>

                    <div id="contenedor-examenes">
                        <!--aqui se insertarán los examenes dinamicamente-->
                    </div>
                </div>
            </div>

            <div id="seccion-alumnos">
                <div id="contenedor-alumnos">
                    <!--Aquí se insertará dinamicamente a los alumnos-->
                </div>
            </div>
            
            <div id="seccion-anuncios">

            </div>
            
            <div id="seccion-contenido">

            </div>
        </div>
    </section>

    <script src="../javascript/PaginaProfesor.js"></script>
</body>
</html>
