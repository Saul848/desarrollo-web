<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesor</title>

    <!-- Tipografías de la maqueta: Archivo Black (título) y Montserrat (resto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/PaginaProfesor.css">
</head>
<body>
    <section id="cabecera">
        <div id="contenedor-botones">
            <button id="tituloPagina"><span>Lakoa I</span></button>

            <button id="btnCorreo" type="button" aria-label="Correo" title="Correo">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                    stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="1"></rect>
                    <path d="M3 6l9 7 9-7"></path>
                </svg>
            </button>

            <div id="contenedor-perfil">
                <button id="btnPerfil" type="button" aria-label="Perfil" title="Perfil">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
                    </svg>
                </button>

                <!--Modal flotante para el botón de perfil-->
                <div id="modal-perfil" hidden>
                    <span id="perfil-nombre">Nombre de usuario</span>
                    <span id="perfil-matricula">Matricula</span>
                    <button id="logout" type="button">Cerrar sesión</button>
                </div>
            </div>
    
        </div>
    </section>

    <section id="areaTrabajo">
        <!--Modal de listado de cursos-->
        <div id="areaCursos" class="modal-class">
            <div id="contenedor-busqueda">
                <input type="text" id="barra-busqueda" placeholder="Buscar curso por id/nombre/etc"
                    aria-label="Buscar curso">
                <button id="btnBuscar" type="button" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="10.5" cy="10.5" r="6"></circle>
                        <path d="M15 15l5 5"></path>
                    </svg>
                </button>
            </div>
            <div id="areaPrincipal">
                <div id="areaBotones">
                <button id="btnCrearCurso" type="button">+ Crear nuevo grupo</button>
                </div>
                <div id="contenedorCursos">
                    <!--Aqui se insertarán los cursos dinamicamente-->
                </div>
            </div>
        </div>
        
        <!--Modal dentro de un curso-->
        <div id="areaActividad" class="modal-class">
            <div id="barra-opciones-profesor">
                <span id="nombre-curso">
                    <!--Aqui se insertará el nombre del curso dinamicamente-->
                </span>
                <div id="barra-botones">
                    <ul>
                        <li>
                            <button type="button" class="activo" data-seccion="actividades">Actividades</button>
                        </li>

                        <li>
                            <button type="button" data-seccion="examenes">Exámenes</button>
                        </li>
                        <li>
                            <button type="button" data-seccion="alumnos">Alumnos</button>
                        </li>
                    </ul>
                </div>
            </div>

            <div id="seccion-actividades" class="seccion-grupo">
                <div id="actividades">

                    <!-- Fila superior: filtros a la izquierda, botón a la derecha -->
                    <div id="barra-acciones-actividades">
                        <div id="filtros-actividades" class="filtros">
                            <ul>
                                <li><button type="button" class="activo" data-filtro="actuales">Actuales</button></li>
                                <li><button type="button" data-filtro="concluidas">Concluidas</button></li>
                                <li><button type="button" data-filtro="prorroga">Con prórroga</button></li>
                            </ul>
                        </div>
                        <button type="button" id="btnCrearActividad">+ Crear Actividad</button>
                    </div>

                    <!-- Dos columnas: actividades + panel lateral -->
                    <div id="distribucion-actividades">
                        <div id="contenedor-actividades">
                            <!--Aqui se insertarán las actividades dinamicamente-->
                        </div>

                        <aside id="panel-avance" aria-labelledby="titulo-avance">
                            <h3 id="titulo-avance">Avance general del grupo</h3>
                            <ul id="lista-avance">
                                <!-- Filas de ejemplo: después se llenarán dinámicamente con los alumnos -->
                                <li class="fila-avance">
                                    <span class="avance-matricula">Matricula</span>
                                    <progress class="avance-barra" value="40" max="100" aria-label="Avance del alumno"></progress>
                                </li>
                                <li class="fila-avance">
                                    <span class="avance-matricula">Matricula</span>
                                    <progress class="avance-barra" value="25" max="100" aria-label="Avance del alumno"></progress>
                                </li>
                                <li class="fila-avance">
                                    <span class="avance-matricula">Matricula</span>
                                    <progress class="avance-barra" value="60" max="100" aria-label="Avance del alumno"></progress>
                                </li>
                            </ul>
                        </aside>
                    </div>

                </div>
            </div>
            
            <div id="seccion-examenes" class="seccion-grupo">
                <div id="examenes">
                    <div id="filtros-examenes" class="filtros">
                        <ul>
                            <li>
                                <button type="button" class="activo" data-filtro="actuales">Actuales</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="concluidas">Concluidas</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="prorroga">Con prorroga</button>
                            </li>
                        </ul>
                        <button type="button" id="btnCrearExamen">+ Crear Examen</button>
                    </div>

                    <div id="contenedor-examenes">
                        <!--aqui se insertarán los examenes dinamicamente-->
                    </div>
                </div>
            </div>

            <div id="seccion-alumnos">
                <div id="contenedor-alumnos">
                    <!--Aquí se insertará dinamicamente a los alumnos-->
                </div>
            </div>
            
            <div id="seccion-anuncios">

            </div>
            
            <div id="seccion-contenido">

            </div>
        </div>
    </section>



    <!--Modal para crear un grupo-->
    <div id="modal-crear-grupo" role="dialog" aria-modal="true" aria-labelledby="titulo-crear-grupo">
        <form id="form-crear-grupo" class="panel-crear-grupo">
            <h2 id="titulo-crear-grupo">Crear grupo</h2>

            <label for="nombre-grupo">Nombre del curso:</label>
            <input type="text" id="nombre-grupo" maxlength="50" placeholder="Matematicas I, Lengua I...">

            <div class="fila-fechas">
                <div class="campo-fecha">
                    <label for="fecha-inicio">Fecha de inicio:</label>
                    <input type="date" id="fecha-inicio">
                </div>
                <div class="campo-fecha">
                    <label for="fecha-fin">Fecha de fin:</label>
                    <input type="date" id="fecha-fin">
                </div>
            </div>

            <label for="buscar-miembros">Miembros</label>
            <div class="campo-busqueda">
                <input type="text" id="buscar-miembros" autocomplete="off"
                    placeholder="Buscar miembros por nombre/matricula">
                <span class="icono-busqueda" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round">
                        <circle cx="10.5" cy="10.5" r="6"></circle>
                        <path d="M15 15l5 5"></path>
                    </svg>
                </span>
            </div>

            <ul id="lista-miembros"></ul>

            <p id="error-crear-grupo" role="alert" hidden></p>

            <div class="acciones-crear-grupo">
                <button type="button" id="btnCancelarGrupo">Cancelar</button>
                <button type="submit" id="btnConfirmarGrupo">+ Crear nuevo grupo</button>
            </div>
        </form>
    </div>

    <!--Modal con el contenido de una actividad-->
    <div id="modal-tarea" role="dialog" aria-modal="true" aria-label="Detalle de la actividad">
        <div class="tarjeta-tarea">

            <div id="barra-tarea">
                <ul>
                    <li><button type="button" class="activo" data-panel="contenido-tarea">Actividad</button></li>
                    <li><button type="button" data-panel="entregas-tarea">Entregas</button></li>
                </ul>
                <button type="button" id="btnCerrarTarea" aria-label="Cerrar">×</button>
            </div>

            <div id="contenido-tarea">
                <div class="campo-detalle">
                    <span class="etiqueta-detalle">Título de actividad:</span>
                    <p id="detalle-titulo"></p>
                </div>
                <div class="campo-detalle">
                    <span class="etiqueta-detalle">Descripción:</span>
                    <p id="detalle-descripcion"></p>
                </div>
            </div>

            <div class="pie-tarea">
                <button type="button" id="btnEliminarTarea">Eliminar actividad</button>
            </div>

        </div>
    </div>

        <!-- Modal para crear examen y reactivos -->
    <div id="modal-crear-examen" class="modal-overlay-examen" role="dialog" aria-modal="true" aria-labelledby="titulo-crear-examen">
        <form id="form-crear-examen" class="panel-crear-examen">
            <div class="cabecera-modal-examen">
                <h2 id="titulo-crear-examen">Crear examen</h2>
                <button type="button" id="btnCerrarModalExamen" class="btn-cerrar-modal" aria-label="Cerrar">&times;</button>
            </div>

            <div class="campo-form">
                <label for="titulo-examen">Título del examen:</label>
                <input type="text" id="titulo-examen" placeholder="Ej. Primer parcial de Álgebra" required>
            </div>

            <div class="fila-campos-examen">
                <div class="campo-form">
                    <label for="fecha-limite-examen">Fecha y hora límite:</label>
                    <input type="datetime-local" id="fecha-limite-examen" required>
                </div>
                <div class="campo-form">
                    <label for="puntos-examen">Puntos totales:</label>
                    <input type="number" id="puntos-examen" min="1" step="0.5" placeholder="100" required>
                </div>
            </div>

            <div class="fila-campos-examen">
                <div class="campo-form">
                    <label for="intentos-examen">Intentos permitidos:</label>
                    <input type="number" id="intentos-examen" min="1" value="1" required>
                </div>
                <div class="campo-form">
                    <label for="tiempo-limite-examen">Tiempo límite (min):</label>
                    <input type="number" id="tiempo-limite-examen" min="1" placeholder="60">
                </div>
            </div>

            <hr class="separador-examen">

            <div class="encabezado-reactivos">
                <h3>Reactivos del examen</h3>
                <button type="button" id="btnAgregarReactivo" class="btn-secundario-turquesa">+ Añadir reactivo</button>
            </div>

            <div id="lista-reactivos">
                <!-- Aquí se agregan dinámicamente las tarjetas de reactivos -->
            </div>

            <p id="error-crear-examen" class="error-form" role="alert" hidden></p>

            <div class="acciones-modal-examen">
                <button type="button" id="btnCancelarExamen" class="btn-cancelar-rojo">Cancelar</button>
                <button type="submit" id="btnConfirmarExamen" class="btn-confirmar-turquesa">+ Crear Examen</button>
            </div>
        </form>
    </div>
    <script src="../javascript/PaginaProfesor.js"></script>
</body>
</html>
