<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumno</title>

    <!-- Tipografías de la maqueta: Archivo Black (título) y Montserrat (resto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/PaginaAlumno.css">
</head>
<body>
    <section id="cabecera">
        <div id="contenedor-botones">
            <button id="tituloPagina"><span>Lakoa I</span></button>

            <button id="btnNotificaciones" type="button"
                aria-label="Notificaciones" title="Notificaciones">

                <svg viewBox="0 0 24 24" width="28" height="28"
                    fill="none" stroke="currentColor"
                    stroke-width="1.6" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">

                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>
            </button>

            <button id="btnCorreo" type="button" aria-label="Correo" title="Correo">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                    stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="1"></rect>
                    <path d="M3 6l9 7 9-7"></path>
                </svg>
            </button>

            <div id="contenedor-perfil">
                <button id="btnPerfil" type="button" aria-label="Perfil" title="Perfil">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
                    </svg>
                </button>

                <!--Modal flotante para el botón de perfil-->
                <div id="modal-perfil" hidden>
                    <span id="perfil-nombre">Nombre de usuario</span>
                    <span id="perfil-matricula">Matricula</span>
                    <button id="logout" type="button">Cerrar sesión</button>
                </div>
            </div>

        </div>
    </section>
    <section id="areaTrabajo">
        <!--modal de listado de cursos-->
        <div id="areaCursos" class="modal-class">
            <div id="contenedor-busqueda">
                <input type="text" id="barra-busqueda" placeholder="Buscar curso por id/nombre/etc" aria-label="Buscar curso">
                <button id="btnBuscar" type="button" aria-label="Buscar">
                </button>
            </div>
            <div id="areaPrincipal">
                <div id="contenedorCursos">
                    <!--Aqui se insertarán los cursos dinamicamente-->
                </div>
            </div>
        </div>
        
        <!--Modal dentro de un curso-->
        <div id="areaActividad" class="modal-class">
            <div id="barra-opciones-alumno">
                <span id="nombre-curso">
                    <!--Aqui se insertará el nombre del curso dinamicamente-->
                </span>
                <div id="barra-botones">
                    <ul>
                        <li>
                            <button type="button" class="activo" data-seccion="actividades">Actividades</button>
                        </li>

                        <li>
                            <button type="button" data-seccion="examenes">Exámenes</button>
                        </li>
                        <li>
                            <button type="button" data-seccion="alumnos">Alumnos</button>
                        </li>
                    </ul>
                </div>
            </div>

            <div id="seccion-actividades" class="seccion-grupo">
                <div id="actividades">
                    <div id="filtros-actividades" class="filtros">
                        <ul>
                            <li>
                                <button type="button" class="activo" data-filtro="actuales">Actuales</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="concluidas">Concluidas</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="prorroga">Con prorroga</button>
                            </li>
                        </ul>
                    </div>

                    <div id="contenedor-actividades">
                        <!--Aqui se insertarán las actividades dinamicamente-->
                    </div>

                    <!-- Dentro de #seccion-actividades -> #actividades, después de #contenedor-actividades: -->
                    <!-- Ventana emergente para ver la actividad y enviar/actualizar entrega -->
                    <div id="detalle-tarea" class="modal-entrega-overlay" role="dialog" aria-modal="true" aria-labelledby="tarea-titulo" style="display: none;">
                        <div class="tarjeta-entrega-modal">
                            <div class="cabecera-entrega-modal">
                                <h3 id="tarea-titulo">Selecciona una tarea</h3>
                                <button type="button" id="btnCerrarDetalleTarea" class="btn-cerrar-entrega" aria-label="Cerrar">×</button>
                            </div>

                            <div class="cuerpo-entrega-modal">
                                <p id="tarea-descripcion" class="texto-detalle-tarea"></p>
                                <div class="meta-entrega">
                                    <span id="tarea-info"></span>
                                    <span id="tarea-estado-entrega" class="estado-entrega-badge"></span>
                                </div>

                                <form id="form-entrega" class="form-entrega-alumno">
                                    <div class="campo-entrega">
                                        <label for="input-contenido">Contenido / respuesta:</label>
                                        <textarea id="input-contenido" rows="4" placeholder="Escribe aquí tu respuesta o comentario..."></textarea>
                                    </div>

                                    <div class="campo-entrega">
                                        <label for="input-archivos">Archivo o nombre de archivo:</label>
                                        <input type="text" id="input-archivos" placeholder="ej. tarea1.pdf">
                                    </div>

                                    <div class="acciones-entrega">
                                        <button type="submit" id="btn-enviar-entrega" class="btn-primario-entrega">Enviar entrega</button>
                                    </div>
                                </form>

                                <p id="mensaje-entrega" class="mensaje-entrega-estado" role="status"></p>
                            </div>
                        </div>
                    </div>
                    
                    <div id="avance-alumno">

                    </div>
                </div>
            </div>
            
            <div id="seccion-examenes" class="seccion-grupo">
                <div id="Examenes">
                    <div id="filtros-examenes" class="filtros">
                        <ul>
                            <li>
                                <button type="button" class="activo" data-filtro="actuales">Actuales</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="concluidas">Concluidas</button>
                            </li>
                            <li>
                                <button type="button" data-filtro="prorroga">Con prorroga</button>
                            </li>
                        </ul>
                    </div>

                    <div id="contenedor-examenes">
                        <!--aqui se insertarán los examenes dinamicamente-->
                    </div>

                    <div id="detalle-examen" class="modal-entrega-overlay" role="dialog" aria-modal="true" aria-labelledby="examen-titulo" style="display: none;">
                        <div class="tarjeta-entrega-modal">
                            <div class="cabecera-entrega-modal">
                                <h3 id="examen-titulo">Detalle del examen</h3>
                                <button type="button" id="btnCerrarDetalleExamen" class="btn-cerrar-entrega" aria-label="Cerrar">×</button>
                            </div>

                            <div class="cuerpo-entrega-modal">
                                <div class="meta-entrega">
                                    <span id="examen-info"></span>
                                </div>
                                <p id="mensaje-examen" class="mensaje-entrega-estado" role="status"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="seccion-alumnos" class="seccion-grupo">
                <div id="alumnos-vista">
                    <div id="barra-acciones-alumnos-vista">
                        <h3 id="titulo-alumnos-vista">Integrantes del grupo</h3>
                    </div>

                    <div id="contenedor-integrantes-grupo">
                        <!-- se insertarán dinámicamente el profesor y los alumnos -->
                    </div>
                </div>
            </div>
            
        </div>
    </section>

    <script src="../javascript/PaginaAlumno.js"></script>
    <script src="../javascript/notificaciones.js"></script>
</body>
</html>
